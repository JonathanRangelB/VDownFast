<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23b6c5ff' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3'/%3E%3C/svg%3E">
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090b18;color:#f3f4fb;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;overflow:hidden;background:linear-gradient(125deg,#080d1d,#11102a 48%,#091b2a);background-size:220% 220%;animation:bg 24s ease-in-out infinite alternate}.scene{position:fixed;inset:0;pointer-events:none;overflow:hidden;color:#a8b7ff}.float{--x:0%;--size:32px;--delay:0s;--duration:24s;position:absolute;left:var(--x);bottom:-70px;width:var(--size);height:var(--size);opacity:0;animation:rise var(--duration) linear var(--delay) infinite;filter:drop-shadow(0 0 12px #8da4ff24)}.float svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.card{position:relative;width:min(520px,calc(100% - 32px));padding:34px;border:1px solid #ffffff1a;border-radius:25px;background:linear-gradient(145deg,#ffffff12,#ffffff08);box-shadow:0 24px 90px #0007,inset 0 1px #ffffff12;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}h1{display:flex;align-items:center;gap:12px;margin:0 0 8px;font-size:25px;font-weight:650;letter-spacing:-.04em}h1 svg{width:28px;height:28px;color:#b6c5ff} .sub{margin:0 0 27px;color:#a1a8c0;font-size:14px}.url{width:100%;height:56px;padding:0 16px;border:1px solid #ffffff22;border-radius:13px;outline:none;background:#080b18a8;color:#f4f5ff;font:inherit;font-size:15px;transition:border-color .2s,box-shadow .2s}.url:focus{border-color:#879cf4;box-shadow:0 0 0 3px #8095ff20}.url::placeholder{color:#78809a}.row{display:flex;gap:10px;margin-top:12px}.strategy{flex:1;min-width:0;height:50px;padding:0 12px;border:1px solid #ffffff20;border-radius:12px;background:#111426;color:#e4e7f4;font:inherit;font-size:13px}.submit{height:50px;padding:0 21px;border:0;border-radius:12px;background:linear-gradient(110deg,#788cff,#a078df);color:white;font:inherit;font-weight:650;cursor:pointer;box-shadow:0 8px 24px #716cff35;transition:transform .2s,filter .2s}.submit:hover{filter:brightness(1.1);transform:translateY(-1px)}.submit:disabled{opacity:.65;cursor:wait;transform:none}.status{min-height:52px;margin:19px 0 0;color:#abb2c9;font-size:14px;line-height:1.5}.status:empty{margin-top:16px}.status.error{color:#ffaaa9}.status.success{color:#a8e9c3}.loading{display:inline-block;width:13px;height:13px;margin-right:8px;border:2px solid #aab5ff55;border-top-color:#c3ceff;border-radius:50%;vertical-align:-2px;animation:spin .8s linear infinite}.result{display:flex;align-items:center;gap:10px}.thumb{width:48px;height:48px;object-fit:cover;border-radius:8px;background:#15192b}.result-title{display:block;max-width:390px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#e7eaf5}.hint{margin-top:11px;color:#777f99;font-size:11px}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bg{to{background-position:100% 70%}}@keyframes rise{0%{transform:translate3d(0,0,0) rotate(-12deg);opacity:0}12%{opacity:.16}82%{opacity:.13}100%{transform:translate3d(24px,-115vh,0) rotate(18deg);opacity:0}}@media(max-width:480px){.card{padding:26px 20px;border-radius:21px}h1{font-size:23px}.row{flex-direction:column}.strategy,.submit{width:100%;height:48px}.sub{margin-bottom:22px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;scroll-behavior:auto!important;transition:none!important}.float{display:none}}
</style>
<style>
#login-view[hidden],#app-view[hidden]{display:none}.login-copy{margin:0 0 23px;color:#a1a8c0;font-size:14px}.login-field{display:block;margin:0 0 12px}.login-field span{display:block;margin:0 0 6px;color:#a1a8c0;font-size:12px}.login-field .url{display:block}.login-submit{width:100%;margin-top:4px}.login-error{min-height:22px;margin:12px 0 0;color:#ffaaa9;font-size:13px}.app-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.logout{border:1px solid #ffffff24;border-radius:9px;background:#ffffff0a;color:#b9c0d6;padding:7px 10px;font:inherit;font-size:12px;cursor:pointer}.logout:hover{background:#ffffff16;color:#fff}.format-select{width:100%;height:50px;margin-top:12px;padding:0 12px;border:1px solid #ffffff20;border-radius:12px;background:#111426;color:#e4e7f4;font:inherit;font-size:13px}.format-select:disabled{opacity:.65}.submit{min-width:118px}.submit:disabled{opacity:.48;cursor:wait}.button-spinner{display:block;width:17px;height:17px;margin:auto;border:2px solid #ffffff60;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@media(max-height:620px){body{overflow:auto;place-items:start center}.card{margin:16px auto}}
</style>
</head>
<body>
<svg aria-hidden="true" width="0" height="0" style="position:absolute"><symbol id="download" viewBox="0 0 24 24"><path d="M12 3v12m-5-5 5 5 5-5M4 17v3h16v-3"/></symbol><symbol id="play" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="m10 8 6 4-6 4z"/></symbol><symbol id="film" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 3v18M17 3v18M3 8h4m-4 8h4m10-8h4m-4 8h4"/></symbol><symbol id="cloud" viewBox="0 0 24 24"><path d="M7 18h10a4 4 0 0 0 .6-8A6 6 0 0 0 6 9a4.5 4.5 0 0 0 1 9Z"/><path d="M12 11v8m-3-3 3 3 3-3"/></symbol><symbol id="image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="8.5" cy="9" r="1.5"/><path d="m21 15-5-5L5 20"/></symbol></svg>
<div class="scene" aria-hidden="true">
<span class="float" style="--x:4%;--size:26px;--delay:-2s;--duration:27s"><svg><use href="#download"/></svg></span><span class="float" style="--x:13%;--size:34px;--delay:-15s;--duration:31s"><svg><use href="#play"/></svg></span><span class="float" style="--x:21%;--size:22px;--delay:-8s;--duration:23s"><svg><use href="#film"/></svg></span><span class="float" style="--x:31%;--size:36px;--delay:-19s;--duration:34s"><svg><use href="#cloud"/></svg></span><span class="float" style="--x:41%;--size:25px;--delay:-4s;--duration:28s"><svg><use href="#image"/></svg></span><span class="float" style="--x:51%;--size:30px;--delay:-23s;--duration:33s"><svg><use href="#download"/></svg></span><span class="float" style="--x:61%;--size:23px;--delay:-11s;--duration:25s"><svg><use href="#play"/></svg></span><span class="float" style="--x:70%;--size:37px;--delay:-7s;--duration:35s"><svg><use href="#film"/></svg></span><span class="float" style="--x:80%;--size:27px;--delay:-17s;--duration:29s"><svg><use href="#cloud"/></svg></span><span class="float" style="--x:91%;--size:33px;--delay:-10s;--duration:32s"><svg><use href="#image"/></svg></span><span class="float" style="--x:97%;--size:21px;--delay:-22s;--duration:26s"><svg><use href="#download"/></svg></span><span class="float" style="--x:26%;--size:19px;--delay:-26s;--duration:30s"><svg><use href="#play"/></svg></span><span class="float" style="--x:74%;--size:20px;--delay:-1s;--duration:24s"><svg><use href="#image"/></svg></span><span class="float" style="--x:46%;--size:24px;--delay:-14s;--duration:30s"><svg><use href="#cloud"/></svg></span>
</div>
<main class="card">
  <section id="login-view" hidden>
    <h1><svg aria-hidden="true"><use href="#download"/></svg>VDownFast</h1>
    <p class="login-copy">Inicia sesión para continuar.</p>
    <form id="login-form" autocomplete="on">
      <label class="login-field"><span>Usuario</span><input class="url" id="login-user" name="username" autocomplete="username" required maxlength="256"></label>
      <label class="login-field"><span>Contraseña</span><input class="url" id="login-pass" name="password" type="password" autocomplete="current-password" required maxlength="1024"></label>
      <button class="submit login-submit" id="login-submit" type="submit">Iniciar sesión</button>
      <p class="login-error" id="login-error" role="alert" aria-live="polite"></p>
    </form>
  </section>
  <section id="app-view" hidden>
    <div class="app-top"><div><h1><svg aria-hidden="true"><use href="#download"/></svg>VDownFast</h1><p class="sub">Descarga contenido de tus redes favoritas.</p></div><button class="logout" id="logout" type="button">Cerrar sesión</button></div>
    <form id="download-form"><input class="url" id="url" type="url" inputmode="url" autocomplete="url" placeholder="Pega aquí el enlace…" aria-label="URL del contenido" required><select class="format-select" id="format" aria-label="Calidad de video o audio" disabled><option value="">Resoluciones: se analizarán al introducir una URL</option></select><div class="row"><select class="strategy" id="strategy" aria-label="Estrategia de descarga"><option value="direct">URL directa (sin conversión)</option><option value="proxy">Proxy streaming (más confiable)</option><option value="server">Servidor descarga y sirve (la más lenta)</option></select><button class="submit" id="submit" type="submit">Descargar</button></div></form>
    <div class="status" id="status" role="status" aria-live="polite"></div><div class="hint">Pegar un enlace compatible inicia la descarga automáticamente. Por defecto intenta 1080p; si no existe, usa la resolución inferior más alta o, si todas son mayores, la menor disponible.</div>
  </section>
</main>
<script>
const SUPPORTED_DOMAINS=__SUPPORTED_DOMAINS__;
const form=document.querySelector('#download-form'),input=document.querySelector('#url'),formatSelect=document.querySelector('#format'),strategy=document.querySelector('#strategy'),button=document.querySelector('#submit'),status=document.querySelector('#status'),loginView=document.querySelector('#login-view'),appView=document.querySelector('#app-view'),loginForm=document.querySelector('#login-form'),loginUser=document.querySelector('#login-user'),loginPass=document.querySelector('#login-pass'),loginSubmit=document.querySelector('#login-submit'),loginError=document.querySelector('#login-error'),logoutButton=document.querySelector('#logout');let lastUrl='',authenticated=false,authEnabled=true,formatsReadyUrl='',auditPendingUrl='',auditSequence=0,auditTimer,isBusy=false,downloadRun=0,activeDownloadId='';
strategy.value=localStorage.getItem('vdown-strategy')||'direct';strategy.addEventListener('change',()=>localStorage.setItem('vdown-strategy',strategy.value));
function validUrl(value){try{const u=new URL(value.trim());return /^https?:$/.test(u.protocol)&&SUPPORTED_DOMAINS.some(d=>u.hostname.toLowerCase()===d||u.hostname.toLowerCase().endsWith('.'+d))?u.href:null}catch{return null}}
function filename(title,ext){const clean=(title||'descarga').normalize('NFKC').replace(/[\\/:*?"<>|\x00-\x1f]/g,'_').replace(/\s+/g,' ').trim().slice(0,150)||'descarga';return clean+(ext?'.'+ext.replace(/^\./,''):'')}
function showError(message){status.className='status error';status.textContent=message}
function showTransfer(title,thumbnail,token,label,className='status'){status.className=className;status.replaceChildren();const wrap=document.createElement('div');wrap.className='result';if(thumbnail&&token){const img=document.createElement('img');img.className='thumb';img.src='/api/thumbnail?t='+encodeURIComponent(token);img.alt='';wrap.append(img)}const text=document.createElement('span');text.className='result-title';text.textContent=label+' · '+title;wrap.append(text);status.append(wrap)}
function showSuccess(title,thumbnail,token,kind){showTransfer(title,thumbnail,token,kind==='audio'?'Descargado ✓':'Descargado ✓','status success')}
function setBusy(value){isBusy=value;button.disabled=value;if(value){button.innerHTML='<span class="button-spinner" aria-hidden="true"></span>';button.setAttribute('aria-label','Descargando');button.setAttribute('aria-busy','true')}else{button.textContent='Descargar';button.removeAttribute('aria-label');button.removeAttribute('aria-busy')}}
async function refreshSession(){try{const response=await fetch('/api/auth/session',{cache:'no-store'});const session=await response.json();authEnabled=session.authEnabled;authenticated=session.authenticated;loginView.hidden=authenticated;appView.hidden=!authenticated;if(authenticated)readClipboard()}catch{authenticated=false;loginView.hidden=false;appView.hidden=true;loginError.textContent='No se pudo comprobar la sesión. Recarga la página.'}}
loginForm.addEventListener('submit',async event=>{event.preventDefault();loginSubmit.disabled=true;loginError.textContent='';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:loginUser.value.trim(),password:loginPass.value})});const result=await response.json();if(!response.ok)throw new Error(result.error||'No se pudo iniciar sesión.');loginPass.value='';await refreshSession()}catch(error){loginError.textContent=error instanceof Error?error.message:'No se pudo iniciar sesión.'}finally{loginSubmit.disabled=false}});
logoutButton.addEventListener('click',async()=>{logoutButton.disabled=true;try{await fetch('/api/auth/logout',{method:'POST'})}catch{}finally{downloadRun++;activeDownloadId='';setBusy(false);authenticated=false;lastUrl='';loginView.hidden=false;appView.hidden=true;loginPass.value='';loginError.textContent='';logoutButton.disabled=false}});
function resetFormats(message='Las resoluciones se analizarán automáticamente'){formatsReadyUrl='';formatSelect.disabled=true;formatSelect.replaceChildren(new Option(message,''))}
async function auditFormats(raw){const url=validUrl(raw);if(!url||formatsReadyUrl===url||auditPendingUrl===url)return;const sequence=++auditSequence;auditPendingUrl=url;resetFormats('Analizando resoluciones y audio…');try{const response=await fetch('/api/formats',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})});if(response.status===401){await refreshSession();return}const data=await response.json();if(!response.ok)throw new Error(data.error||'No se pudieron analizar los formatos.');if(sequence!==auditSequence||validUrl(input.value)!==url)return;const groups=[['video','Vídeo (incluye audio)'],['audio','Solo audio'],['image','Imágenes']];formatSelect.replaceChildren();for(const [kind,label] of groups){const options=data.formats.filter(item=>item.kind===kind);if(!options.length)continue;const group=document.createElement('optgroup');group.label=label;for(const item of options){const option=new Option(item.label,item.key);group.append(option)}formatSelect.append(group)}formatsReadyUrl=url;if(data.defaultFormat)formatSelect.value=data.defaultFormat;formatSelect.disabled=data.formats.length===0;if(!data.formats.length)formatSelect.append(new Option('Sin formatos listables; se usará la selección automática',''))}catch(error){if(sequence===auditSequence){resetFormats(error instanceof Error?error.message:'No se pudieron analizar los formatos.')}}finally{if(sequence===auditSequence)auditPendingUrl=''}}
async function monitorDownload(jobId,run,data){const waitingSince=Date.now();while(run===downloadRun&&activeDownloadId===jobId){await new Promise(resolve=>setTimeout(resolve,650));try{const response=await fetch('/api/downloads/'+encodeURIComponent(jobId)+'/status',{cache:'no-store'});if(response.status===401){await refreshSession();throw new Error('La sesión expiró. Inicia sesión nuevamente.')}if(!response.ok)throw new Error('No se pudo consultar el estado de la descarga.');const job=await response.json();if(job.status==='complete'){activeDownloadId='';showSuccess(data.title,data.thumbnail,data.token,data.kind);setBusy(false);return}if(job.status==='error'){activeDownloadId='';showError(job.error||'La descarga no pudo completarse.');setBusy(false);return}if(job.status==='waiting'&&Date.now()-waitingSince>60_000)throw new Error('El navegador no inició la transferencia. Inténtalo nuevamente.')}catch(error){if(run===downloadRun){activeDownloadId='';showError(error instanceof Error?error.message:'Error al consultar la descarga.');setBusy(false)}return}}}
async function start(raw,manual=false){if(!authenticated||isBusy)return;const url=validUrl(raw);if(!url){if(manual)showError('Introduce una URL válida de una plataforma compatible.');return}if(!manual&&url===lastUrl)return;lastUrl=url;input.value=url;const selectedFormat=formatsReadyUrl===url?formatSelect.value:'';if(formatsReadyUrl!==url)void auditFormats(url);const run=++downloadRun;setBusy(true);status.className='status';status.innerHTML='<span class="loading"></span>Resolviendo…';let hasJob=false;try{const payload={url,strategy:strategy.value,...(selectedFormat?{format:selectedFormat}:{})};const response=await fetch('/api/resolve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const data=await response.json();if(response.status===401){await refreshSession();throw new Error('La sesión expiró. Inicia sesión nuevamente.')}if(!response.ok)throw new Error(data.error||'No se pudo resolver el enlace.');if(!data.jobId)throw new Error('El servidor no devolvió un identificador de descarga.');activeDownloadId=data.jobId;hasJob=true;showTransfer(data.title,data.thumbnail,data.token,data.kind==='audio'?'Descargando audio…':'Descargando…');if(data.mode==='server'||data.fileId){location.href='/api/file/'+encodeURIComponent(data.fileId)}else{const name=filename(data.title,data.ext);const a=document.createElement('a');a.hidden=true;a.href='/api/proxy?u='+encodeURIComponent(data.directUrl)+'&name='+encodeURIComponent(name)+'&t='+encodeURIComponent(data.token);document.body.append(a);a.click();a.remove()}void monitorDownload(data.jobId,run,data)}catch(error){activeDownloadId='';showError(error instanceof Error?error.message:'Error al iniciar la descarga.');setBusy(false)}finally{if(!hasJob&&run===downloadRun)setBusy(false)}}
form.addEventListener('submit',event=>{event.preventDefault();start(input.value,true)});
input.addEventListener('input',()=>{clearTimeout(auditTimer);const url=validUrl(input.value);if(!url){auditSequence++;auditPendingUrl='';resetFormats();return}if(url!==formatsReadyUrl)auditTimer=setTimeout(()=>void auditFormats(url),350)});
async function readClipboard(){if(!authenticated)return;try{const text=await navigator.clipboard.readText();const url=validUrl(text);if(url){input.value=url;void auditFormats(url);start(url,false)}}catch{}}
window.addEventListener('focus',readClipboard);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')readClipboard()});document.addEventListener('paste',event=>{if(!authenticated)return;const text=event.clipboardData?.getData('text')||'';const url=validUrl(text);if(url){event.preventDefault();input.value=url;void auditFormats(url);start(url,false)}});void refreshSession();
</script>
</body></html>
